<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Harmonic Eccentricity</title>
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="fav.svg">
  
  <style>
    /* --- PERFECT RESET --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      position: fixed;
      width: 100%;
      height: 100%;
      height: 100dvh;
    }
    
    /* --- MAIN CONTAINER --- */
    #main-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      height: 100dvh;
      padding: 20px;
      gap: 8px;
    }
    
    /* --- TITLE (CENTER TOP) --- */
    .title-bar {
      text-align: center;
      flex-shrink: 0;
      padding: 2px 0;
      width: 100%;
    }
    .title-bar .title {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 8px;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
    }
    .title-bar .title .accent {
      color: #c9a84c;
      font-weight: 400;
    }
    
    /* --- CANVAS CONTAINER --- */
    #canvas-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 0;
      padding: 0 10px;
      position: relative;
    }
    
    canvas {
      display: block;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      image-rendering: auto;
      touch-action: none;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      transition: opacity 0.6s ease, transform 0.6s ease;
      background: #0a0a0a;
    }
    
    /* --- SHIRT MOCKUP --- */
    #shirt-mockup {
      display: none;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    #shirt-mockup.active {
      display: block;
      animation: fadeIn 0.6s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    
    canvas.hidden {
      display: none;
    }
    
    /* --- BOTTOM BAR --- */
    .bottom-bar {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 6px;
      padding: 4px 0;
    }
    
    /* --- CONTROLS --- */
    .controls-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    
    .controls {
      color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.04);
      padding: 8px 20px;
      border-radius: 30px;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif;
      font-size: 11px;
      font-weight: 400;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: all 0.3s ease;
      letter-spacing: 0.8px;
      touch-action: manipulation;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .controls:hover {
      color: rgba(255,255,255,0.95);
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
    }
    .controls:active {
      transform: scale(0.95);
    }
    .controls .key {
      color: rgba(255,255,255,0.5);
      font-weight: 300;
    }
    .controls .sep {
      color: rgba(255,255,255,0.15);
      margin: 0 4px;
    }
    
    /* --- SHIRT BUTTON --- */
    .controls.shirt-btn {
      border-color: rgba(201, 168, 76, 0.2);
      color: rgba(201, 168, 76, 0.7);
      letter-spacing: 1px;
    }
    .controls.shirt-btn:hover {
      border-color: rgba(201, 168, 76, 0.4);
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.06);
    }
    .controls.shirt-btn.active {
      border-color: rgba(201, 168, 76, 0.5);
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.08);
    }
    .controls.shirt-btn .icon {
      font-size: 14px;
      line-height: 1;
    }
    
    /* --- INFO ROW --- */
    .info-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      color: rgba(255,255,255,0.3);
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
      font-size: 9px;
      letter-spacing: 0.5px;
      flex-wrap: wrap;
      padding: 2px 0;
    }
    .info-row .info-item {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.04);
      background: rgba(255,255,255,0.02);
    }
    .info-row .label {
      color: rgba(255,255,255,0.25);
      font-weight: 300;
    }
    .info-row .value {
      color: rgba(255,255,255,0.6);
      font-weight: 400;
    }
    
    /* --- DESCRIPTION --- */
    .description {
      display: block;
      text-align: center;
      color: rgba(255,255,255,0.25);
      font-size: 8px;
      letter-spacing: 1.2px;
      line-height: 1.8;
      padding: 2px 10px;
      font-weight: 300;
      max-width: 500px;
      width: 100%;
      text-transform: uppercase;
    }
    .description .highlight {
      color: rgba(255,255,255,0.4);
    }
    .description .sep {
      color: rgba(255,255,255,0.08);
      margin: 0 4px;
    }
    
    /* ============================================
       RESPONSIVE
    ============================================ */
    
    @media (max-width: 1024px) {
      #main-container { padding: 16px; gap: 6px; }
      .title-bar .title { font-size: 20px; letter-spacing: 6px; }
      .controls { font-size: 10px; padding: 7px 16px; min-height: 34px; }
      .info-row { font-size: 8.5px; gap: 12px; }
      .info-row .info-item { padding: 2px 10px; }
      .description { font-size: 7.5px; letter-spacing: 1px; }
    }
    
    @media (max-width: 768px) {
      #main-container { padding: 12px; gap: 5px; }
      .title-bar .title { font-size: 17px; letter-spacing: 5px; }
      #canvas-container { padding: 0 6px; }
      .controls { font-size: 9px; padding: 6px 14px; min-height: 32px; letter-spacing: 0.6px; }
      .controls-row { gap: 6px; }
      .info-row { font-size: 8px; gap: 10px; }
      .info-row .info-item { padding: 2px 8px; }
      .description { font-size: 7px; letter-spacing: 0.8px; padding: 2px 6px; }
      .controls.shirt-btn .icon { font-size: 12px; }
    }
    
    @media (max-width: 480px) {
      #main-container { padding: 8px; gap: 4px; }
      .title-bar .title { font-size: 14px; letter-spacing: 4px; }
      #canvas-container { padding: 0 4px; }
      .controls { font-size: 8px; padding: 5px 12px; min-height: 28px; border-radius: 24px; letter-spacing: 0.4px; }
      .controls-row { gap: 4px; }
      .info-row { font-size: 7px; gap: 8px; }
      .info-row .info-item { padding: 2px 6px; gap: 4px; }
      .description { font-size: 6.5px; letter-spacing: 0.6px; padding: 2px 4px; line-height: 1.6; }
      .controls.shirt-btn .icon { font-size: 11px; }
    }
    
    @media (max-width: 380px) {
      #main-container { padding: 6px; gap: 3px; }
      .title-bar .title { font-size: 12px; letter-spacing: 3px; }
      #canvas-container { padding: 0 2px; }
      .controls { font-size: 7px; padding: 4px 10px; min-height: 26px; border-radius: 20px; }
      .info-row { font-size: 6.5px; gap: 6px; }
      .info-row .info-item { padding: 1px 5px; border-radius: 14px; }
      .description { font-size: 6px; letter-spacing: 0.5px; padding: 1px 3px; }
      .controls.shirt-btn .icon { font-size: 10px; }
    }
    
    @media (orientation: landscape) and (max-height: 500px) {
      #main-container { padding: 10px 20px; gap: 4px; flex-direction: row; flex-wrap: wrap; }
      .title-bar { width: 100%; flex-shrink: 0; }
      .title-bar .title { font-size: 16px; letter-spacing: 4px; }
      #canvas-container { flex: 1; min-height: 0; height: 100%; padding: 0 8px; }
      .bottom-bar { width: auto; max-width: 180px; flex-shrink: 0; gap: 4px; padding: 0 4px; }
      .controls { font-size: 8px; padding: 5px 12px; min-height: 28px; letter-spacing: 0.4px; }
      .controls-row { flex-direction: column; gap: 4px; }
      .info-row { font-size: 7px; gap: 6px; flex-direction: column; align-items: stretch; }
      .info-row .info-item { padding: 2px 8px; justify-content: center; }
      .description { font-size: 6px; max-width: 160px; padding: 1px 4px; line-height: 1.4; letter-spacing: 0.5px; }
    }
    
    @media (orientation: landscape) and (max-height: 380px) {
      #main-container { padding: 6px 12px; gap: 3px; }
      .title-bar .title { font-size: 13px; letter-spacing: 3px; }
      #canvas-container { padding: 0 4px; }
      .bottom-bar { max-width: 140px; gap: 3px; }
      .controls { font-size: 7px; padding: 4px 10px; min-height: 24px; border-radius: 16px; }
      .info-row { font-size: 6px; gap: 4px; }
      .info-row .info-item { padding: 1px 6px; }
      .description { font-size: 5.5px; max-width: 120px; padding: 1px 3px; }
    }
    
    @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
      canvas { image-rendering: auto; }
    }
    
    @supports (-webkit-touch-callout: none) {
      .controls { min-height: 40px; }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .controls, canvas, #shirt-mockup { transition: none; }
      #shirt-mockup.active { animation: none; }
    }
  </style>
</head>
<body>

<!-- MAIN CONTAINER -->
<div id="main-container">

  <!-- TITLE (CENTER TOP) -->
  <div class="title-bar">
    <div class="title"><span class="accent">Harmonic</span> Eccentricity</div>
  </div>

  <!-- CANVAS CONTAINER -->
  <div id="canvas-container">
    <canvas id="target"></canvas>
    <img id="shirt-mockup" src="Harmonic-Eccentricity.jpg" alt="Harmonic Eccentricity on T-Shirt" />
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">

    <!-- CONTROLS ROW -->
    <div class="controls-row">
      <div class="controls" id="controlsBar">
        <span class="key">●</span> regenerate <span class="sep">—</span> <span class="key">S</span> save
      </div>
      <div class="controls shirt-btn" id="shirtToggle">
        <span class="icon">◷</span> apparel
      </div>
    </div>

    <!-- INFO ROW -->
    <div class="info-row">
      <div class="info-item">
        <span class="label">seed</span>
        <span class="value" id="seedDisplay">---</span>
      </div>
      <div class="info-item">
        <span class="label">layers</span>
        <span class="value" id="layersDisplay">---</span>
      </div>
      <div class="info-item">
        <span class="label">shapes</span>
        <span class="value" id="shapesDisplay">---</span>
      </div>
    </div>

    <!-- DESCRIPTION -->
    <div class="description">
      <span class="highlight">hue harmony</span>
      <span class="sep">·</span>
      <span class="highlight">5 shapes</span>
      <span class="sep">·</span>
      <span class="highlight">5–9 layers</span>
      <span class="sep">·</span>
      <span class="highlight">20–50 segments</span>
      <span class="sep">·</span>
      <span class="highlight">seed-based</span>
    </div>

  </div>

</div>

<script>
// ============================================
// HUE HARMONY — PURE JS T-SHIRT EDITION
// ============================================

// --- DETERMINISTIC RANDOM GENERATOR ---
class RandomGenerator {
  constructor(seed) {
    this.seed = seed;
    this.state = seed;
  }
  rand() {
    let x = this.state;
    x ^= x << 13;
    x ^= x >> 17;
    x ^= x << 5;
    this.state = x;
    return (x >>> 0) / 4294967296;
  }
}

// --- STATE ---
const ratio = 1 / 1;
const prefix = 'Hue Harmony';
const features = {};
let seed = Date.now() + Math.random() * 1000000;
let rng = new RandomGenerator(seed);
let showingShirt = false;
let resizeTmr = null;
let thumbnailTaken = false;
let animated = false;
let nextFrame = null;

// --- URL PARAMS ---
const urlSearchParams = new URLSearchParams(window.location.search);
const urlParams = Object.fromEntries(urlSearchParams.entries());
let forceDownloaded = false;

// --- HSL TO RGB ---
function hslToRgb(h, s, l) {
  s /= 100;
  l /= 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r, g, b;
  if (h < 60) { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  return {
    r: Math.round((r + m) * 255),
    g: Math.round((g + m) * 255),
    b: Math.round((b + m) * 255)
  };
}

// --- SHAPE FUNCTIONS ---
function drawLineShape(ctx, r, w) {
  const len = r * 0.1;
  ctx.beginPath();
  ctx.moveTo(r - len, 0);
  ctx.lineTo(r + len, 0);
  ctx.stroke();
}

function drawArcShape(ctx, r, w) {
  const angleSpan = 10 + rng.rand() * 40;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, angleSpan * Math.PI / 180);
  ctx.stroke();
}

function drawTriangleShape(ctx, r, w) {
  const offset = rng.rand() * (w * 0.015);
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(r + offset, offset);
  ctx.lineTo(r - offset, -offset);
  ctx.closePath();
  ctx.stroke();
}

function drawRectShape(ctx, r, w) {
  const rectW = w * (0.01 + rng.rand() * 0.02);
  const rectH = w * (0.005 + rng.rand() * 0.01);
  ctx.beginPath();
  ctx.rect(r - rectW / 2, -rectH / 2, rectW, rectH);
  ctx.stroke();
}

function drawBezierShape(ctx, r, w) {
  const o = rng.rand() * (w * 0.02);
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.bezierCurveTo(r + o, o, r - o, -o, r * 1.1, 0);
  ctx.stroke();
}

// --- SETUP ---
function setup() {
  // Generate dark background
  const darkHue = rng.rand() * 360;
  const darkSat = 30 + rng.rand() * 40;
  const darkLight = 5 + rng.rand() * 15;
  features.bgHue = darkHue;
  features.bgSat = darkSat;
  features.bgLight = darkLight;

  const layers = Math.floor(rng.rand() * 4) + 5;
  const segments = Math.floor(rng.rand() * 30) + 20;
  const baseHue = rng.rand() * 360;

  features.layers = layers;
  features.segments = segments;
  features.baseHue = baseHue;
}

// --- MAIN DRAW ---
function drawCanvas() {
  window.cancelAnimationFrame(nextFrame);

  const canvas = document.getElementById('target');
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  const size = Math.min(w, h);
  const centerX = w / 2;
  const centerY = h / 2;

  // Draw dark background (HSL)
  const bgColor = hslToRgb(features.bgHue, features.bgSat, features.bgLight);
  ctx.fillStyle = 'rgb(' + bgColor.r + ',' + bgColor.g + ',' + bgColor.b + ')';
  ctx.fillRect(0, 0, w, h);

  const layers = features.layers || 5;
  const segments = features.segments || 20;
  const baseHue = features.baseHue || 0;

  // Shape palette
  const shapePalette = [
    drawLineShape,
    drawArcShape,
    drawTriangleShape,
    drawRectShape,
    drawBezierShape
  ];

  ctx.lineWidth = w * 0.00125;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (let layer = 0; layer < layers; layer++) {
    const radius = (layer + 1) * (size / (2 * layers + 2));

    for (let i = 0; i < segments; i++) {
      const angle = i * (360 / segments);
      const shapeFn = shapePalette[Math.floor(rng.rand() * shapePalette.length)];

      const hueShift = (baseHue + angle / 2 + layer * 10) % 360;
      const sat = 60 + rng.rand() * 20;
      const light = 50 + rng.rand() * 30;

      const color = hslToRgb(hueShift, sat, light);
      ctx.strokeStyle = 'rgba(' + color.r + ',' + color.g + ',' + color.b + ',0.8)';

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(angle * Math.PI / 180);
      shapeFn(ctx, radius, size);
      ctx.restore();
    }
  }

  if ('forceDownload' in urlParams && forceDownloaded === false) {
    forceDownloaded = true;
    autoDownloadCanvas();
    if (window.parent) {
      window.parent.postMessage('forceDownloaded', '*');
    }
  }

  if (animated) {
    nextFrame = window.requestAnimationFrame(drawCanvas);
  }

  updateUI();
}

// --- UPDATE UI ---
function updateUI() {
  document.getElementById('seedDisplay').textContent = String(seed).slice(0, 8);
  document.getElementById('layersDisplay').textContent = features.layers || '---';
  document.getElementById('shapesDisplay').textContent = features.segments || '---';
}

// --- REGENERATE ---
function regenerate() {
  seed = Date.now() + Math.random() * 1000000;
  rng = new RandomGenerator(seed);
  thumbnailTaken = false;
  
  setup();
  
  if (showingShirt) {
    toggleShirt();
  }
  
  layoutCanvas();
}

// --- TOGGLE SHIRT ---
function toggleShirt() {
  showingShirt = !showingShirt;
  const canvas = document.getElementById('target');
  const shirtMockup = document.getElementById('shirt-mockup');
  const shirtToggle = document.getElementById('shirtToggle');
  
  if (showingShirt) {
    canvas.classList.add('hidden');
    shirtMockup.classList.add('active');
    shirtToggle.classList.add('active');
    shirtToggle.innerHTML = '<span class="icon">◷</span> artwork';
  } else {
    canvas.classList.remove('hidden');
    shirtMockup.classList.remove('active');
    shirtToggle.classList.remove('active');
    shirtToggle.innerHTML = '<span class="icon">◷</span> apparel';
  }
}

// --- DOWNLOAD ---
function autoDownloadCanvas() {
  const canvas = document.getElementById('target');
  const link = document.createElement('a');
  
  const seedStr = String(seed).slice(0, 8);
  link.download = prefix + '_Seed' + seedStr + '.png';
  
  if (showingShirt) {
    link.href = document.getElementById('shirt-mockup').src;
  } else {
    link.href = canvas.toDataURL('image/png', 1.0);
  }
  link.click();
}

// --- LAYOUT CANVAS ---
function layoutCanvas() {
  window.cancelAnimationFrame(nextFrame);
  
  const container = document.getElementById('canvas-container');
  const containerRect = container.getBoundingClientRect();
  let maxWidth = containerRect.width;
  let maxHeight = containerRect.height;
  
  maxWidth = Math.max(maxWidth, 80);
  maxHeight = Math.max(maxHeight, 80);
  
  let cWidth = maxWidth;
  let cHeight = cWidth / ratio;
  
  if (cHeight > maxHeight) {
    cHeight = maxHeight;
    cWidth = maxHeight * ratio;
  }
  
  cWidth = Math.max(cWidth, 80);
  cHeight = Math.max(cHeight, 80);
  
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  
  let targetWidth = cWidth * dpr;
  let targetHeight = cHeight * dpr;
  
  if ('forceWidth' in urlParams) {
    targetWidth = parseInt(urlParams.forceWidth);
    targetHeight = Math.floor(targetWidth / ratio);
    dpr = 1;
  }
  
  const canvas = document.getElementById('target');
  canvas.width = targetWidth;
  canvas.height = targetHeight;
  canvas.style.width = cWidth + 'px';
  canvas.style.height = cHeight + 'px';
  
  const shirtMockup = document.getElementById('shirt-mockup');
  shirtMockup.style.width = cWidth + 'px';
  shirtMockup.style.height = cHeight + 'px';
  
  drawCanvas();
}

// --- RESIZE ---
function handleResize() {
  clearTimeout(resizeTmr);
  resizeTmr = setTimeout(() => {
    layoutCanvas();
  }, 100);
}

// --- KEYBOARD ---
document.addEventListener('keydown', function(e) {
  if (e.key === 's' || e.key === 'S') {
    e.preventDefault();
    autoDownloadCanvas();
  }
  if (e.key === 'r' || e.key === 'R') {
    e.preventDefault();
    regenerate();
  }
  if (e.key === 't' || e.key === 'T') {
    e.preventDefault();
    toggleShirt();
  }
});

// --- CONTROLS ---
document.getElementById('controlsBar').addEventListener('click', regenerate);
document.getElementById('controlsBar').addEventListener('touchend', function(e) {
  e.preventDefault();
  regenerate();
});

document.getElementById('shirtToggle').addEventListener('click', toggleShirt);
document.getElementById('shirtToggle').addEventListener('touchend', function(e) {
  e.preventDefault();
  toggleShirt();
});

// --- WINDOW ---
window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', function() {
  setTimeout(handleResize, 400);
});

// --- VISIBILITY ---
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) {
    setTimeout(() => {
      if (!showingShirt) {
        drawCanvas();
      }
    }, 100);
  }
});

// --- INIT ---
function init() {
  setup();
  layoutCanvas();
